name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    name: Type-check and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Tests (protocol, OAuth, safety, flows, Connect, MCP Apps, emulator)
        run: npm test

  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, whole history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Dependency audit (fail on high or critical)
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

  infra:
    name: CloudFormation lint and policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cfn-lint
        run: |
          pip install --quiet cfn-lint
          cfn-lint infra/*.yaml
      - name: cfn-guard (policy as code)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/aws-cloudformation/cloudformation-guard/main/install-guard.sh | sh
          ~/.guard/bin/cfn-guard validate --rules infra/guard/rules.guard --data infra/app.yaml --data infra/connect.yaml --show-summary fail

  image:
    name: Build and scan the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -f infra/Dockerfile -t callassist:ci .
      - name: Smoke test (health check)
        run: |
          docker run -d --name ca -p 8787:8787 -e HOST=0.0.0.0 -e AUTH=off callassist:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/healthz && exit 0; sleep 1; done
          docker logs ca; exit 1
      - name: Scan the image (Trivy, fail on critical)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: callassist:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
