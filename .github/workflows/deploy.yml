name: deploy

# Runs after CI passes on main. Signs in to AWS with OIDC (no stored keys), builds the
# arm64 image tagged with the commit, pushes it to ECR, and deploys it on the EC2 server
# through SSM Run Command. The server health-checks the new container and rolls back
# to the previous image by itself if the check fails.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}

      - name: Sign in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push (arm64, tag = commit)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/callassist:${{ env.SHA }}
          provenance: false

      - name: Deploy on the server (SSM, no SSH)
        run: |
          CMD_ID=$(aws ssm send-command \
            --targets "Key=tag:role,Values=callassist-app" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${SHA::7}" \
            --parameters "commands=[\"/opt/callassist/deploy.sh ${SHA}\"]" \
            --query Command.CommandId --output text)
          echo "SSM command $CMD_ID"
          INSTANCE=$(aws ec2 describe-instances --filters Name=tag:role,Values=callassist-app Name=instance-state-name,Values=running --query 'Reservations[0].Instances[0].InstanceId' --output text)
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query StandardOutputContent --output text; exit 0 ;;
              Failed|Cancelled|TimedOut) aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query '[StandardOutputContent,StandardErrorContent]' --output text; exit 1 ;;
            esac
            sleep 5
          done
          echo "deploy timed out"; exit 1

  drift:
    name: Weekly drift check
    if: ${{ github.event_name == 'workflow_dispatch' && vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Detect drift on every CallAssist stack
        run: |
          for STACK in callassist-app callassist-connect; do
            ID=$(aws cloudformation detect-stack-drift --stack-name "$STACK" --query StackDriftDetectionId --output text) || continue
            for i in $(seq 1 30); do
              S=$(aws cloudformation describe-stack-drift-detection-status --stack-drift-detection-id "$ID" --query '[DetectionStatus,StackDriftStatus]' --output text)
              case "$S" in DETECTION_COMPLETE*) echo "$STACK: $S"; break ;; esac
              sleep 5
            done
          done
